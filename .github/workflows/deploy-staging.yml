name: Deploy Staging

on:
  push:
    branches:
      - staging

# Cancel in-progress runs on the same branch
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Detect which apps actually changed
  # ──────────────────────────────────────────────
  detect-changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      # Compare against the previous push to this branch so only the right
      # deploy job runs. Without `base`, paths-filter diffs against the
      # default branch (main): whenever main already matches staging — e.g.
      # a feature merged to main and then staging fast-forwarded — it sees
      # no changes and silently skips both deploys.
      # A change to this workflow redeploys both apps.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'packages/**'
              - '.github/workflows/deploy-staging.yml'
            backend:
              - 'apps/backend/**'
              - 'packages/**'
              - '.github/workflows/deploy-staging.yml'

  # ──────────────────────────────────────────────
  # 2. Deploy Frontend → Cloudflare Pages
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @repo/schemas build
          pnpm --filter @repo/database db:generate
          pnpm --filter @repo/database build

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          # ── Add every VITE_* var your frontend needs ──
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # Shared vehicle links (#16). All optional: repository variables
          # (or secrets) of the same name. Empty store URLs fall back to the
          # Play listing / the website page; an empty ANDROID_CERT_SHA256 or
          # APPLE_TEAM_ID skips that /.well-known file.
          VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL || secrets.VITE_PLAY_STORE_URL }}
          VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL || secrets.VITE_APP_STORE_URL }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 || secrets.ANDROID_CERT_SHA256 }}
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || secrets.ANDROID_PACKAGE_NAME }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || secrets.IOS_BUNDLE_ID }}

      # Wrangler reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from env.
      # Replace <YOUR_CF_PROJECT_NAME> with your Cloudflare Pages project name.
      - name: Deploy to Cloudflare Pages
        run: |
          pnpm dlx wrangler pages deploy apps/frontend/dist \
            --project-name=wowrentals-staging \
            --branch=staging \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ──────────────────────────────────────────────
  # 3. Deploy Backend → Digital Ocean VPS (pm2)
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Digital Ocean VPS)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Setup SSH access to VPS ──────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DO_VPS_HOST }}" >> ~/.ssh/known_hosts

      # ── Deploy on VPS via SSH ────────────────────
      # Strategy: git pull on the server → pnpm install → build → pm2 restart
      # The VPS must have a GitHub deploy key with read access to this repo.
      # (See "VPS one-time setup" section in the README)
      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=no \
              "${{ secrets.DO_VPS_USER }}@${{ secrets.DO_VPS_HOST }}" \
              -p "${{ secrets.DO_VPS_PORT || '22' }}" \
              bash << 'ENDSSH'
            set -e

            # Load nvm and set PATH so pnpm/pm2 are available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.local/share/pnpm:$PATH"

            cd /var/www/vrms

            echo "==> Pulling latest code..."
            git fetch origin staging

            # Tag whatever is currently checked out before discarding it, so a
            # hotfix made directly on the server is recoverable rather than lost.
            git tag -f "pre-deploy-$(date +%Y%m%d-%H%M%S)" HEAD >/dev/null 2>&1 || true

            # Hard reset instead of pull. A pull fails outright when the server
            # checkout has diverged ("Need to specify how to reconcile divergent
            # branches"), which silently blocked every deploy from 2026-08-14
            # onward. The server is a deploy target, not a place to develop, so
            # origin/staging is always the intended state.
            #
            # No `git clean` here on purpose: .env files on the server are
            # untracked, and cleaning would delete them.
            git reset --hard origin/staging

            echo "==> Installing dependencies..."
            pnpm install --frozen-lockfile

            # The regenerated Prisma client selects every column in the schema,
            # so columns a release adds must exist before it is built and started.
            # Only migrations written to be re-runnable (IF NOT EXISTS guards)
            # are listed; they are no-ops once applied. Runs before the build so
            # a failure stops the deploy with the old build still in place.
            echo "==> Applying idempotent database migrations..."
            DB_ENV_FILE=/var/www/vrms/packages/db/.env
            [ -f "$DB_ENV_FILE" ] || DB_ENV_FILE=/var/www/vrms/apps/backend/.env
            for migration in \
              20260927090000_licence_drop_damage_utr \
              20261001090000_client_batch_oct \
              20261003090000_todo17_batch
            do
              (cd packages/db && pnpm exec dotenv -e "$DB_ENV_FILE" -- \
                pnpm exec prisma db execute \
                  --schema prisma/schema.prisma \
                  --file "prisma/migrations/$migration/migration.sql")
            done

            echo "==> Building shared packages..."
            pnpm --filter @repo/schemas build
            pnpm --filter @repo/database db:generate
            pnpm --filter @repo/database build

            echo "==> Building backend..."
            pnpm --filter backend build

            echo "==> Restarting pm2 process..."
            pm2 describe wuw-backend > /dev/null 2>&1 \
              && pm2 restart wuw-backend \
              || pm2 start apps/backend/dist/index.js \
                  --name wuw-backend \
                  --env staging

            pm2 save

            # Item 8 (Oct 3 2026): drop / recovery charges carry no GST. Legacy
            # drops completed before that release but not settled yet still hold
            # GST on their ChargeEntry rows (and PENDING invoice); restate them.
            # Runs after the restart so the old build can't write new GST rows
            # meanwhile. Idempotent: a no-op once nothing open carries GST. Open
            # Unified drop bills need no write (they report billStale and are
            # recomputed by staff) and are only listed.
            # Same env as the running backend: apps/backend/.env first, then the
            # database .env for anything it leaves unset (e.g. DATABASE_URL).
            echo "==> Restating open legacy drop charges without GST..."
            (cd packages/db && pnpm exec dotenv \
              -e /var/www/vrms/apps/backend/.env \
              -e /var/www/vrms/packages/db/.env -- \
              node /var/www/vrms/apps/backend/dist/scripts/restateOpenDropGst.js --apply)
            echo "==> Done."
          ENDSSH
